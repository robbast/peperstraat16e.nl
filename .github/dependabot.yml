version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Bundle dev tools together so upgrades don't create noise
      build-tools:
        patterns:
          - vite
          - vite-plugin-static-copy
      # stylelint-config-standard has a peer dependency on stylelint, so majors must land together
      stylelint:
        patterns:
          - stylelint
          - stylelint-*
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
