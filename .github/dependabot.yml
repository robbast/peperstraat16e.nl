version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Bundle dev tools together so upgrades don't create noise
      build-tools:
        patterns:
          - vite
          - vite-plugin-static-copy

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
